<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galèrapagos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2f3a;--panel:#17424f;--sand:#f1e3b8;--lag:#2bb3a3;--ember:#ff5d73;--wood:#b07a45;--ink:#fff8e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh}
main{max-width:1040px;margin:0 auto;padding:14px 16px}
h1{margin:0 0 4px;font-size:2rem;color:var(--sand)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.card{background:var(--panel);border-radius:14px;padding:10px 14px;flex:1;min-width:130px}
.card b{display:block;font-size:1.5rem}
.card small{display:block;opacity:.8}
.meter{height:8px;background:#0b2229;border-radius:6px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--lag);transition:width .9s}
.arbox .meter i{transition:none}
body.ar #game,body.ar h1{visibility:hidden}
.taq{display:grid;grid-template-columns:repeat(3,76px);gap:6px;justify-content:center;margin:8px auto}
.tl{height:76px;font-size:2rem;font-weight:700;border-radius:12px;border:2px solid var(--sand);background:#1d4a5a;color:#fff;padding:0}
.tl.ok{background:#2a9d8f}.tl.em{visibility:hidden}
.hs{display:flex;flex-direction:column;gap:3px;margin:6px 0;font-size:1.25rem}
.hs div{display:flex;justify-content:center;gap:14px}
.cur{display:flex;justify-content:center;gap:8px;margin:8px 0;font-size:1.8rem}
.cur span{width:44px;height:44px;border:2px dashed var(--sand);border-radius:50%;display:flex;align-items:center;justify-content:center}
.kbd{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:8px 0}
.kbd button{padding:8px 0;font-size:.9rem}
.amrow{margin:8px 0;padding:6px;border:1px solid #fff3;border-radius:10px}
.food i{background:var(--ember)}.wood i{background:var(--wood)}
.camp{display:flex;gap:8px;flex-wrap:wrap;flex:4;min-width:260px;border-left:6px solid var(--cc,#2bb3a3);padding-left:8px}
.camp .ct{width:100%;font-weight:600}
.card.fl{animation:fl .9s}
@keyframes fl{0%{background:var(--lag);transform:scale(1.06)}100%{transform:none}}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pl{position:relative;background:var(--panel);border-radius:12px;padding:8px 10px;border:2px solid transparent;font-size:.92rem}
.pl.cur{border-color:var(--sand)}.pl.dead{opacity:.4}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#last{margin:10px 0;padding:10px 14px;background:#0b2229;border-left:5px solid var(--ember);border-radius:8px;min-height:44px}
#act{display:none;background:var(--sand);color:#2b2112;border-radius:14px;padding:14px;margin:10px 0}
#act.on{display:block}#act p{margin:0 0 8px;font-weight:600;font-size:1.05rem}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#handwrap{margin:10px 0}
#hand{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c{background:var(--sand);color:#2b2112}
#detail{background:var(--panel);border-radius:12px;padding:10px 14px;margin-top:8px}#detail:empty{display:none}
#detail p{margin:4px 0 8px}
#log{background:#0b2229;border-radius:12px;padding:10px;height:240px;overflow:auto;font-size:.92rem;line-height:1.45}
#log hr{border:0;border-top:1px solid #2b5560}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(5,15,20,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal[hidden]{display:none}
#fx,#arena{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(5,15,20,.84);z-index:30}
#arena{z-index:25;background:rgba(5,15,20,.94)}
#fx.on,#arena.on{display:flex}
.box,.fxbox,.arbox{background:var(--sand);color:#2b2112;border-radius:16px;padding:18px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:8px;max-height:92vh;overflow:auto}
.fxbox,.arbox{background:var(--panel);color:var(--ink);border:3px solid var(--sand);text-align:center;max-width:560px;display:block}
.fxbox.wide,.arbox{max-width:720px}
.box p{margin:0 0 2px;font-size:1.05rem;font-weight:600}
.box label{display:flex;gap:8px;align-items:center}
.box input[type=text]{flex:1;padding:7px;border-radius:8px;border:1px solid #b9a974;font:inherit;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:10px;padding:9px 13px;background:var(--wood);color:#fff;cursor:pointer}
button:hover,button:focus-visible{background:var(--ember);outline:2px solid var(--ink)}
button.sel,button.big{background:var(--lag);color:#06222a}
.fxt{font-size:1.2rem;font-weight:600;margin-bottom:8px}
.fxbig{font-size:1.4rem;font-weight:600;padding:10px}
.fxr{font-size:1.2rem;font-weight:600;min-height:1.6em}
.bag{font-size:3rem;animation:shake .5s infinite alternate}
@keyframes shake{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.balls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0;min-height:44px}
.ball{width:38px;height:38px;border-radius:50%;background:#789;border:2px solid #fff6;transform:scale(0)}
.ball.show{animation:pop .45s forwards}.ball.wh{background:#fff}.ball.bk{background:#111;border-color:#f55}
@keyframes pop{0%{transform:translateY(-40px) scale(0)}70%{transform:translateY(4px) scale(1.2)}100%{transform:scale(1)}}
.wcard{width:130px;height:170px;margin:8px auto;perspective:600px}
.flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:flipin 1s .3s forwards}
.flip>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:3rem;flex-direction:column}
.flip .cb{background:#1b5f70;border:3px solid var(--sand)}
.flip .ft{background:var(--sand);color:#2b2112;transform:rotateY(180deg)}
.flip .ft small{font-size:.8rem;padding:0 6px}
@keyframes flipin{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.hum{overflow:visible}
.hum .a,.hum .l{transform-box:fill-box;transform-origin:50% 0}
.hum.run .l1,.hum.run .a2{animation:sw .35s infinite alternate}
.hum.run .l2,.hum.run .a1{animation:sw .35s infinite alternate-reverse}
@keyframes sw{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
.hum.cheer .a1{animation:up1 .5s infinite alternate}.hum.cheer .a2{animation:up2 .5s infinite alternate}
@keyframes up1{from{transform:rotate(140deg)}to{transform:rotate(175deg)}}
@keyframes up2{from{transform:rotate(-140deg)}to{transform:rotate(-175deg)}}
.hum.sway{animation:sway 1s infinite alternate;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.cel{position:relative;height:210px;margin:6px auto;width:min(440px,100%);container-type:inline-size;overflow:hidden;border-radius:12px;background:linear-gradient(#0000 70%,#0006 70%)}
.cel .cw{position:absolute;left:calc(var(--x)*1%);bottom:var(--b,22px);margin-left:-17px;text-align:center}
.cel .cw b{display:block;font:700 .62rem sans-serif;white-space:nowrap;margin-left:-14px;margin-right:-14px}
.cel .cw svg{display:block;margin:0 auto}
.cel.jump .cw{animation:cjump .5s ease-out infinite alternate;animation-delay:calc(var(--i)*-.17s)}
@keyframes cjump{from{transform:translateY(0)}to{transform:translateY(-46px)}}
.cel.ola .cw{animation:cola 1.6s infinite;animation-delay:calc(var(--i)*.16s)}
@keyframes cola{0%,35%,100%{transform:none}17%{transform:translateY(-54px)}}
.cel.solo .cw{animation:csolo 1.2s ease-in-out infinite alternate}@keyframes csolo{from{transform:none}to{transform:translateY(-9px)}}
.hum.ckb .a1{animation:ckl .6s infinite alternate}.hum.ckb .a2{animation:ckr .6s infinite alternate}
.cel.felic .cw{animation:cfel 1.6s ease-in-out infinite alternate}@keyframes cfel{from{transform:none}to{transform:translateX(calc(var(--dx,0)*1cqw))}}
.cel.hug .cw{animation:chug 2.2s ease-in-out infinite alternate}
@keyframes chug{0%,15%{transform:none}60%,100%{transform:translateX(calc(var(--dx)*1cqw)) scale(1.06)}}
.hum.hr .a1,.hum.hr .a2{animation:ahr .5s infinite alternate}
.hum.hl .a1,.hum.hl .a2{animation:ahl .5s infinite alternate}
@keyframes ahr{from{transform:rotate(-70deg)}to{transform:rotate(-100deg)}}
@keyframes ahl{from{transform:rotate(70deg)}to{transform:rotate(100deg)}}
.hum.ckr .a2{animation:ckr .35s infinite alternate}.hum.ckl .a1{animation:ckl .35s infinite alternate}
@keyframes ckr{from{transform:rotate(-135deg)}to{transform:rotate(-155deg)}}
@keyframes ckl{from{transform:rotate(135deg)}to{transform:rotate(155deg)}}
.cel.check .cw{animation:cchk 1.2s ease-in-out infinite alternate}
@keyframes cchk{0%{transform:none}100%{transform:translateX(calc(var(--dx)*1cqw))}}
.cel .hrt,.cel .hand{position:absolute;font-size:1.7rem;animation:chr 1.5s infinite;opacity:0}
@keyframes chr{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
.cel .hand{animation:chp .6s infinite alternate;opacity:1}
@keyframes chp{from{transform:scale(.7) rotate(-12deg)}to{transform:scale(1.4) rotate(12deg)}}
.cel.ronde .cw{left:50%;bottom:74px;animation:cox 2s ease-in-out infinite alternate;animation-delay:calc(var(--i)*var(--ph)*-1s)}
.cel.ronde .cw>.oy{animation:coy 2s ease-in-out infinite alternate;animation-delay:calc((var(--i)*var(--ph) + 1)*-1s)}
@keyframes cox{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
@keyframes coy{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
.cel .fire{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);font-size:2.4rem;animation:cfl .3s infinite alternate}
@keyframes cfl{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.18) rotate(4deg)}}
.cel.pyr .top{animation:cpy .5s ease-in-out infinite alternate}
@keyframes cpy{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.cel.toss .mid{animation:ctoss 1.5s ease-in-out infinite}
@keyframes ctoss{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-120px) rotate(12deg)}}
.cel.toss .sd{animation:cjump .5s ease-out infinite alternate;animation-delay:calc(var(--i)*-.2s)}
.cel .cf{position:absolute;top:-20px;font-size:1.1rem;animation:ccf 2.6s linear infinite}
@keyframes ccf{to{transform:translateY(240px) rotate(240deg)}}
.cel .bub{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:#fff;color:#222;border-radius:12px;padding:3px 10px;font:800 .8rem sans-serif;animation:chp .5s infinite alternate}
/* camp explorable */
.campw{position:relative;width:100%;max-width:540px;height:310px;margin:6px auto;border-radius:14px;overflow:hidden;border:3px solid #e6c88a;touch-action:none;user-select:none;background:linear-gradient(#8fd6f3 0,#c5ecf7 18%,#3f8f4c 18%,#5faa5e 52%,#e8d49a 52%,#efdca4 78%,#2fa6c9 78%,#1b7fa8 100%)}
.campw .sp{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:2rem;line-height:1;pointer-events:none}
.campw .sp small{display:block;font:700 .58rem sans-serif;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.campw .sp.on{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 4px gold);animation:spb .5s infinite alternate}
@keyframes spb{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-56%) scale(1.14)}}
.campw .pw{position:absolute;transform:translate(-50%,-100%);pointer-events:none;width:44px;text-align:center}
.campw .pw svg{display:block;margin:0 auto;width:30px;height:55px}
.campw .pw b{display:block;font:700 .55rem sans-serif;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.campw .pw i{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);font-style:normal;font-size:.9rem;background:#fffd;border-radius:9px;padding:0 5px;white-space:nowrap}
.campw .glow{position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(#ffb34788,#0000 65%);transform:translate(-50%,-50%);animation:glw .3s infinite alternate;pointer-events:none}
@keyframes glw{from{opacity:.65}to{opacity:1}}
.campw .hud{position:absolute;left:6px;top:4px;background:#0009;color:#fff;border-radius:9px;padding:2px 8px;font:700 .72rem sans-serif;z-index:5}
.campw .wth{position:absolute;right:6px;top:4px;font-size:1.3rem;z-index:5}
.campw .amb{position:absolute;pointer-events:none;font-size:1.1rem}
.campw .amb.bd{top:6%;left:-8%;animation:cbd 14s linear infinite}
@keyframes cbd{to{left:108%}}
.campw .amb.cr{top:68%;left:20%;animation:ccr 6s ease-in-out infinite alternate}
@keyframes ccr{to{left:70%}}
.campw .amb.fi{top:84%;left:30%;animation:cfi 3.2s ease-in-out infinite}
@keyframes cfi{0%,70%,100%{opacity:0;transform:translateY(6px)}80%{opacity:1;transform:translateY(-14px) rotate(-30deg)}90%{opacity:1;transform:translateY(2px) rotate(30deg)}}
.campw .sea{position:absolute;left:0;right:0;bottom:0;height:22%;overflow:hidden;pointer-events:none}
.campw .sea:before{content:"〰️ 〰️ 〰️ 〰️ 〰️ 〰️ 〰️ 〰️ 〰️ 〰️ 〰️ 〰️";position:absolute;left:0;top:4px;white-space:nowrap;opacity:.45;animation:csw 6s linear infinite;font-size:1rem}
@keyframes csw{to{transform:translateX(-120px)}}
.campb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0}

.lane{position:relative;height:74px;background:#0b2229;border-radius:10px;margin:6px 0;overflow:hidden;text-align:left}
.lane::after{content:'🏁';position:absolute;right:6px;bottom:4px}
.lane .fig{position:absolute;left:0;bottom:2px;transition:left 2.4s cubic-bezier(.25,.7,.35,1)}
.lane .nm{position:absolute;left:8px;top:4px;font-size:.8rem;opacity:.9}
.line{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.who{display:flex;flex-direction:column;align-items:center;font-size:.75rem}
.tm{font-size:1.1rem;margin:6px 0;min-height:1.5em}
.bigc{font-size:3rem;font-weight:600;margin:10px 0}
.beam{position:relative;height:26px;background:#5b3a1e;border-radius:8px;margin:12px 0}
.beam .zone{position:absolute;left:40%;width:20%;top:0;bottom:0;background:#2bb3a3aa}
.beam .mk{position:absolute;top:-4px;width:6px;height:34px;background:#fff;border-radius:3px;left:50%}
.sig{padding:30px 10px;border-radius:14px;font-size:1.4rem;font-weight:600;margin:10px 0}
.sig.red{background:#a33}.sig.green{background:#2a9d4a}
.tot{font-size:2rem;padding:14px 18px}.tot.lit{background:var(--sand);color:#000;transform:scale(1.15)}
.rc{border-left:6px solid var(--cc,#2bb3a3);padding-left:10px;margin:8px 0;text-align:left}
.rb{display:grid;grid-template-columns:minmax(64px,130px) minmax(0,1fr) 36px;gap:8px;align-items:center;margin:4px 0;font-size:.9rem}
.rb>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rb .meter{min-width:0;max-width:100%}.rb .meter i{max-width:100%}.rc{overflow:hidden;max-width:100%}
.rb .meter{margin:0}.rb b{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{background:#0b2229;border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;font-size:.8rem;min-width:84px;animation:pop .5s backwards}
.chip.ok{border:2px solid #2a9d4a}.chip.sick{border:2px solid #f4a261}.chip.dead{border:2px solid #666;opacity:.55}
.scene{height:130px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(#5aa9d6,#bfe6f5);font-size:2.4rem;margin-bottom:10px}
.scene .plane{position:absolute;top:30px;left:-10%;animation:fly 4s linear infinite}
@keyframes fly{to{left:100%}}
.scene .cl{position:absolute;font-size:2rem;opacity:.9}
.scene.sc-storm{background:linear-gradient(#34495e,#6c7a89)}
.plane.shk{left:40%!important;animation:jit .15s infinite alternate!important}
@keyframes jit{from{transform:translate(-4px,2px) rotate(-5deg)}to{transform:translate(4px,-2px) rotate(5deg)}}
.scene .bolt{position:absolute;right:20%;top:10px;animation:bolt 1s infinite}
@keyframes bolt{0%,60%{opacity:0}65%,100%{opacity:1}}
.scene.sc-crash{background:linear-gradient(#7a8b99,#2c6e8f)}
.plane.fall{left:20%!important;top:-10px!important;animation:fall 3s ease-in forwards!important}
@keyframes fall{to{top:90px;left:60%;transform:rotate(80deg)}}
.scene .fire{position:absolute;left:62%;bottom:22px;animation:shake .3s infinite alternate}
.sea{position:absolute;bottom:0;left:0;right:0;font-size:1.6rem;animation:wave 1s infinite alternate}
@keyframes wave{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.scene.sc-island{background:linear-gradient(#ffd89b,#19547b)}
.scene.sc-koh{background:linear-gradient(#ffb347,#2c6e49)}
.scene .isl{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:3rem}
.scene .crew{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.scene .crew .hum{width:24px;height:44px}
.tw{min-height:5.5em;font-size:1.05rem;line-height:1.45;text-align:left}
.qbig{font-size:3rem;min-height:3.4rem;line-height:1.1}.qbig small{font-size:.9rem;margin-left:6px;opacity:.6}.qbig span{display:inline-block;background:#fff;color:#222;border-radius:14px;padding:0 18px;box-shadow:0 3px 0 #0004}
.prow{display:flex;gap:8px;align-items:center;margin:5px 0}.prow input[type=text]{flex:1;min-width:0}.skb{display:flex;flex-direction:column;align-items:center;padding:3px 6px;min-width:62px;background:#0002;border-radius:12px;gap:0}.skb small{font-size:.6rem;line-height:1.1;max-width:62px;text-align:center}.skb svg{width:28px;height:50px}
.cv{width:100%;max-width:520px;border-radius:12px;background:#9bd5ff;touch-action:none;display:block;margin:6px auto}
.rope{position:relative;height:110px;margin:8px 0}
.rope .rl{position:absolute;left:0;bottom:0}.rope .rl2{position:absolute;right:0;bottom:0}
.rbar{position:absolute;left:44px;right:44px;top:56px;height:6px;background:#c9a96a;border-radius:3px}
.flag{position:absolute;top:-26px;transform:translateX(-50%);font-size:1.6rem;transition:left .08s}
.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:8px auto}
.hb{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.hb i{width:10px;height:6px;border-radius:2px;background:#ffffff33}
.hb i.on1{background:#f4a261}.hb i.on2{background:#e76f51}.hb i.on3{background:#999}
@media (prefers-color-scheme:light){:root{--bg:#e9f4f1}body{color:#10303a}.card,.pl,#detail{background:#cfe6e1}h1{color:#10303a}#log,#last{background:#fff}}

svg.hum.hostfig{width:70px;height:126px;flex:none;animation:hostin .7s both}
.hostbox{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:8px 0}
@keyframes hostin{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
.bub{position:relative;background:#fff;color:#1d2a33;border-radius:16px;padding:10px 14px;text-align:left;font-size:.92rem;max-width:300px;animation:pop .5s .5s backwards}
.bub:before{content:"";position:absolute;left:-8px;bottom:22px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.ballot{margin:10px 0}.ballot .paper{display:inline-block;background:#f4e9c9;color:#2b2112;padding:16px 28px;border:2px solid #8a6a3a;border-radius:4px;font-weight:800;font-size:1.5rem;transform:rotate(-2deg);box-shadow:0 6px 14px #0006;animation:unfold .55s both}
@keyframes unfold{from{transform:rotateX(90deg) scale(.6)}to{transform:rotate(-2deg)}}
.evl{max-height:150px;overflow:auto;text-align:left;font-size:.8rem;background:#0b2229;border-radius:10px;padding:6px 10px;margin:8px 0}
.evl div{padding:1px 0}
.tribeh{grid-column:1/-1;font-weight:800;padding:2px 8px;border-left:6px solid var(--cc);margin-top:4px}
.gold{display:inline-block;font-size:4rem;animation:goldf .5s infinite alternate}
@keyframes goldf{from{filter:none;transform:scale(1)}to{filter:drop-shadow(0 0 14px gold) sepia(1) saturate(6);transform:scale(1.25)}}

#skp{position:fixed;inset:0;background:#000b;z-index:90;display:flex;align-items:center;justify-content:center;padding:12px}
#skp .skbox{background:var(--panel);color:var(--ink);border:3px solid var(--sand);border-radius:16px;padding:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0}

 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const sc=G.mode==='koh'?[147,175,196,220,262,294]:[196,220,262,294,330,392,440];

/* ---------- ambiance sonore de l'intro (histoire qui fait peur) ---------- */
let AMB=null;
function ambOn(){if(!S.music)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const t=AC.currentTime,out=AC.createGain();out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.7,t+2.5);out.connect(AC.destination);
 const osc=(f,type,v)=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createBiquadFilter();o.type=type;o.frequency.value=f;l.type='lowpass';l.frequency.value=260;g.gain.value=v;o.connect(l);l.connect(g);g.connect(out);o.start();return o};
 const os=[osc(55,'sawtooth',.07),osc(58.3,'sawtooth',.06),osc(82.4,'triangle',.05)];
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 AMB={out,os,nb,iv:null}}catch(e){AMB=null}}
function ambNoise(vol,dur,freq){if(!AMB)return;try{const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=AMB.nb;f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(60,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AMB.out);s.start();s.stop(t+dur+.1)}catch(e){}}
function ambNote(f,vol,dur,type){if(!AMB)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AMB.out);o.start();o.stop(t+dur+.1)}catch(e){}}
function ambSlide(i){if(!AMB)return;clearInterval(AMB.iv);const minor=[220,261.6,329.6,415.3,440,523.3,622.3];
 if(i===0)AMB.iv=setInterval(()=>ambNote(pick(minor)*.5,.05,3,'triangle'),2600);
 else if(i===1){ambNoise(.6,3,600);AMB.iv=setInterval(()=>{ambNoise(pick([.5,.9]),2.4,pick([250,400,700]));ambNote(110,.04,2,'sawtooth')},2400)}
 else if(i===2){ambNoise(1,3.2,900);ambNote(1244.5,.05,2.5,'sawtooth');setTimeout(()=>ambNote(1318.5,.04,2.5,'sawtooth'),600);AMB.iv=setInterval(()=>ambNoise(.25,2,200),2500)}
 else AMB.iv=setInterval(()=>{ambNote(pick(minor),.07,1.8);if(Math.random()<.3)ambNote(pick(minor)*1.5,.04,1.5)},1000)}
function ambOff(){if(!AMB)return;const a=AMB;AMB=null;clearInterval(a.iv);try{a.out.gain.cancelScheduledValues(AC.currentTime);a.out.gain.setValueAtTime(a.out.gain.value,AC.currentTime);a.out.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1.5);setTimeout(()=>{a.os.forEach(o=>{try{o.stop()}catch(e){}})},1700)}catch(e){}}

 if(i==null)i=await ask('Quelle action ?',['🎣 Pêcher','💧 Collecter de l\'eau',c.fire?'🪵 Bois pour le feu':'🔥 Allumer le feu (éteint)','🌴 Fouiller l\'île','😴 Passer mon tour (aucun risque)','↩ Retour'],p);

 chrono:{icon:'⏳',name:'Le sablier (éliminatoire)',kind:'Confort',desc:'Tous les aventuriers jouent chaque manche : arrête le sablier au plus près du temps annoncé, qui change à chaque manche (le chrono disparaît après 2 s). À chaque manche, les plus éloignés de la cible sont éliminés de l\'épreuve ; le dernier en lice gagne.'},
 paires:{icon:'🧩',name:'Paires de totems',kind:'Confort',desc:'Retrouve les 6 paires de symboles avant la fin du temps (40 secondes). Plus tu es rapide, plus tu marques. Par équipes : c\'est un relais ! Toute la tribu partage un seul plateau, chacun joue à son tour jusqu\'au premier raté, et la tribu la plus rapide à tout retrouver gagne.'},
 arc3d:{icon:'🏹',name:'Tir à l\'arc (3D)',kind:'Confort',desc:'Épreuve solo à élimination ! À chaque manche, tout le monde tire une flèche (vise avec la souris, le doigt ou le stick, tire avec clic, Espace ou A ; le vent dévie la flèche et ta main tremble). Celui dont la flèche est la plus proche du centre élimine un joueur de son choix, et ainsi de suite jusqu\'au dernier archer.'},
 corde:{icon:'🪢',name:'Tir à la corde (duels)',kind:'Immunité',desc:'Des duels un contre un : spamme Espace (ou le bouton) plus vite que ton adversaire pour tirer la corde de ton côté. En tribus, chaque duel gagné rapporte un point ; en solo, c\'est un tournoi à élimination directe.'},
 course3d:{icon:'🌴',name:'Parcours en forêt (3D)',kind:'Immunité',desc:'Cours dans la forêt : change de voie (Q/D ou flèches), saute (Z, Espace ou A) par-dessus les troncs, les rondins qui roulent et la boue, baisse-toi (S) sous les branches, et enchaîne les slaloms. Ça accélère ! 30 secondes.'},
 poutre3d:{icon:'⚖️',name:'Poutre d\'équilibre (3D)',kind:'Immunité',desc:'Traverse une longue poutre au-dessus de l\'eau, sans limite de temps : spamme Espace (ou A) pour avancer et penche-toi (Q/D, souris ou stick) pour compenser le vent. Un faux pas et c\'est le plouf ! Plus tu arrives vite, plus tu marques.'},
 orientation:{icon:'🧭',name:'Orientation',kind:'Immunité',desc:'Perdu dans une grande forêt ! La table d\'orientation, près du départ, indique ce que signifie chaque couleur de drapeau (Rouge = Nord, etc.). 8 directions possibles (dont Nord-Est, Sud-Ouest…). Suis la couleur du départ jusqu\'à la 1re balise : son drapeau indique la direction de la suivante, et ainsi de suite jusqu\'à la 4e. Une balise n\'apparaît qu\'une fois la précédente trouvée. Brouillard, carte sans balises ni position (le bouton 📍 te situe, mais coûte 4 s).'},
 ronde:{icon:'🔄',name:'La ronde (équipes)',kind:'Immunité',desc:'Les tribus courent en rond dans le même sens, chacune attachée par une corde et chacune poursuivant la suivante (à deux tribus, l\'une poursuit l\'autre). Personne ne peut aller plus vite que le groupe, celui qui traîne ralentit tout le monde, et si l\'un va beaucoup plus vite qu\'un autre la corde se tend et toute la tribu ralentit : il faut garder le même rythme ! Appuie sur Q puis D en alternance (ou ◀ ▶). La première tribu qui rattrape celle qu\'elle poursuit gagne.'},
 planche:{icon:'⚖️',name:'La planche (équipes)',kind:'Immunité',desc:'Toute ta tribu est debout sur une planche en équilibre. Chacun bouge : adapte-toi aux mouvements de tes coéquipiers (Q/D, souris ou stick) pour garder la planche à plat. Le vent souffle en rafales et déséquilibre la planche : il faut aussi le compenser. L\'épreuve dure jusqu\'à ce qu\'il ne reste qu\'une seule tribu debout : les autres basculent à l\'eau.'},
 bambou:{icon:'🎋',name:'Le bambou (équilibre)',kind:'Confort',desc:'Un bambou en équilibre sur ta tête ! Appuie vite sur la flèche demandée (plus tu tardes, plus il penche) tout en gardant le point rouge dans le cercle (souris, doigt ou stick). Le cercle rétrécit de temps en temps. Pas de limite de temps, mais à partir de 30 secondes ça devient de plus en plus dur : tiens le plus longtemps possible !'},
 etoile:{icon:'⭐',name:'L\'étoile',kind:'Confort',desc:'Tiens la position en étoile entre les deux murs : maintiens des touches du clavier enfoncées. Une nouvelle touche s\'ajoute régulièrement et les précédentes doivent rester enfoncées en même temps. Dès qu\'une touche est relâchée, tu es éliminé : le dernier en lice gagne.'},
 equilibre:{icon:'🌊',name:'Équilibre sur l\'eau',kind:'Immunité',desc:'Traversée de poutre au-dessus de l\'eau, tous en même temps, manche après manche : les derniers arrivés (ou tombés) sont éliminés de l\'épreuve, jusqu\'à ce qu\'il n\'en reste qu\'un. Spamme Espace pour avancer, penche-toi pour compenser le vent.'},
 lestee:{icon:'🎒',name:'Course d\'obstacles lestée',kind:'Immunité',desc:'Épreuve solo : course d\'obstacles en plusieurs manches avec un sac de poids sur chaque joueur. Le dernier de chaque manche est éliminé et choisit à qui il donne ses poids : plus on porte de poids, plus on est lent !'},
 quilles:{icon:'🎳',name:'Quilles de coco (3D)',kind:'Confort',desc:'Lance une noix de coco sur 10 quilles : un clic pour la direction, un clic pour la puissance. Mais la noix prend un effet imprévisible (flèche ⬅/➡), les curseurs s\'accélèrent à chaque lancer, trop faible elle s\'arrête en route, et les quilles sont plus solides. 3 lancers.'},
 koalas:{icon:'🐨',name:'Les koalas (3D)',kind:'Immunité',desc:'Épreuve par équipes : chaque tribu est accrochée à un tronc qui se balance au-dessus de l\'eau. Spamme Espace (ou A) pour t\'accrocher et penche-toi (Q/D, souris ou stick) à l\'opposé du balancement : l\'équilibre dépend de toute la tribu, il faut s\'adapter à ses coéquipiers et compenser quand l\'un d\'eux tombe. Les tribus dont tous les koalas sont tombés sont éliminées : la dernière accrochée gagne.'},
 parcours:{icon:'🪖',name:'Parcours du combattant (3D)',kind:'Immunité',desc:'Course simultanée : tu vois tous les autres. Sprint en spam d\'Espace (ou A), puis QTE sur chaque structure (mur, filet) : appuie vite sur la flèche affichée. Sur la poutre, plus de QTE : avance en spammant Espace tout en gardant ton équilibre (souris, stick ou touches J / L) : si tu tombes, tu recules et perds beaucoup de temps ! Épreuve solitaire : ça glisse aussi sur le mur et le filet.'},
 taquin:{icon:'🧩',name:'Le taquin',kind:'Confort',desc:'Puzzle stratégique : fais glisser les tuiles (clic, ou flèches) pour remettre les chiffres de 1 à 8 dans l\'ordre. 75 secondes. Plus tu es rapide, plus tu marques.'},
 code:{icon:'🔐',name:'Le code secret',kind:'Confort',desc:'Puzzle de déduction : un code de 4 couleurs toutes différentes (parmi 6) est caché. Essaie des combinaisons : ● = bonne couleur bien placée, ○ = bonne couleur mal placée. 8 essais maximum : moins tu en utilises, plus tu marques.'},
 touches:{icon:'⌨️',name:'Touches éclair',kind:'Confort',desc:'Une lettre de l\'alphabet s\'affiche : appuie dessus sur ton clavier (ou sur l\'écran) avant la fin de la barre ! 20 lettres, de plus en plus vite. Une mauvaise touche compte comme raté.'},
 aveugle:{icon:'🙈',name:'L\'aveugle et le guide',kind:'Immunité',desc:'Épreuve en duo avec un ordinateur (grand terrain) : l\'un est aveugle, l\'autre voit tout le terrain et le guide. Si tu es aveugle, tu ne vois rien : déplace-toi (flèches, ZQSD ou boutons) en suivant les indications de ton guide. Si tu es le guide, dirige ton partenaire avec les flèches (Espace = stop). Il faut rapporter 5 drapeaux, un à droite, un à gauche, en aller-retour. Un rocher te fait perdre un instant. 85 secondes.'},
 grille:{icon:'🔒',name:'Apnée et grille',kind:'Immunité',desc:'Épreuve sous l\'eau : plonge au fond récupérer 3 clés 🗝️ et rapporte-les aux 3 cadenas de la grille qui te bloque le passage. Quand tout est ouvert, la grille se lève : nage vers la sortie ! Remonte respirer, évite les méduses (elles te font lâcher ta clé). 90 secondes.'},
 pots:{icon:'🏺',name:'Saut et pots de poterie',kind:'Confort',desc:'Saute du plongeoir et casse un maximum de pots de poterie 🏺 suspendus dans le vide ou flottant sur l\'eau ! Choisis la puissance de ton saut, puis dirige-toi en l\'air (plonge pour tomber vite, plane pour rester en l\'air). 3 sauts, les pots dorés valent double.'},
 boue:{icon:'🟤',name:'La boue',kind:'Immunité',desc:'Traversée d\'un parcours de boue en 3D : alterne Q et D pour ramper, gère ton énergie dans les bassins de boue et baisse-toi sous les cordes tendues. Arrive le premier au bout !'},
 plongee:{icon:'🤿',name:'La plongée en apnée',kind:'Immunité',desc:'Épreuve aquatique : plonge, ramasse les perles au fond et ramène-les à la surface avant de manquer d\'air (60 secondes). Nage avec les flèches, ZQSD ou les boutons. Évite les méduses qui te coûtent de l\'air. Plus tu transportes de perles, plus ton air fond vite. Si tu t\'évanouis, tu perds les perles que tu portais.'},
 coursepuzzle:{icon:'🏃',name:'Course et puzzle',kind:'Immunité',desc:'Épreuve mixte sport + logique, longue et exigeante : un sprint 3D de 45 s (alterne Q et D sans jamais ralentir, et saute les 3 obstacles 🚧 à temps), puis un puzzle coulissant 3×3 à remettre en ordre en moins de 110 s. Le temps total et les obstacles ratés décident du score.'},
 sarbacane:{icon:'🪨',name:'Le lance-pierres 3D',kind:'Immunité',desc:'Tends l\'élastique du lance-pierres : tire en arrière pour la puissance, décale sur le côté pour viser. 45 secondes pour toucher le plus de cibles 🎯 dans le champ en 3D : certaines sont petites, lointaines ou mobiles, les dorées valent plus, et le vent dévie tes tirs !'},
 poteau:{icon:'🏝️',name:'Les poteaux (3D)',kind:'Finale',desc:'Les trois derniers aventuriers sont perchés sur un poteau. Garde le point rouge dans le cercle (souris, doigt, ZQSD ou stick) pour rester stable. Le dernier debout gagne et choisit son adversaire en finale.'}};

 let t=0,n=0,sum=0,x=150,y=100,stop=false,last=performance.now();
 const frame=()=>{if(stop)return;const now=performance.now();t+=(now-last)/1000;last=now;const sp=1+n*.3;x=150+115*Math.sin(t*1.7*sp);y=100+75*Math.sin(t*2.3*sp+1);const xh=$('#xh');if(xh){xh.setAttribute('cx',x);xh.setAttribute('cy',y)}requestAnimationFrame(frame)};requestAnimationFrame(frame);

MG.memoire=async p=>{await mgIntro(EPR.memoire,p);const ic=['🔥','🌴','🐚','🦜'],LIM=150000*TS;

 const t0=performance.now(),left=()=>Math.max(0,LIM-(performance.now()-t0));
 const fmt=()=>{const r=Math.ceil(left()/1000/TS);return Math.floor(r/60)+':'+String(r%60).padStart(2,'0')};
 const flash=async(i,ms)=>{const b=$('#ic')&&$('#ic').children[i];if(!b)return;b.classList.add('lit');await sleep(ms);b.classList.remove('lit')};
 const seq=[];let done=0,over=false;
 while(!over){seq.push(Math.random()*4|0);const tm=$('#tm');if(tm)tm.textContent=`Suite de ${seq.length} · ⏱ ${fmt()} · regarde…`;await sleep(550);
  const sp=Math.max(190,450-done*10),gap=Math.max(60,180-done*5);

  if(over)break;
  if($('#tm'))$('#tm').textContent=`Suite de ${seq.length} · à toi !`;
  const ok=await new Promise(res=>{let j=0,iv=setInterval(()=>{const tm2=$('#tm');if(tm2)tm2.textContent=`Suite de ${seq.length} · ${j}/${seq.length} · ⏱ ${fmt()}`;if(left()<=0){clearInterval(iv);$('#ic').onclick=null;res(false)}},200);
   $('#ic').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;flash(i,170);if(i!==seq[j]){clearInterval(iv);res(false);return}j++;if(j===seq.length){clearInterval(iv);res(true)}}});
  $('#ic').onclick=null;if(!ok)break;done++}
 const sc=Math.round(100*(1-Math.exp(-done/12)));
 return endMG(sc,`${done} suite(s) réussie(s) — jusqu'à ${done} totems d'affilée`)};

 const DUR=40000*TS,t0=performance.now();let open=[],found=0,lock=false,done=false;

async function netGuestPlay(d){

 if(NET.done.has(d.id)){netSend({k:'ans',id:d.id,v:NET.done.get(d.id)});return}
 if(NET.busy||!NET.begun)return;
 NET.busy=true;let v;const fiv=setInterval(()=>netFrame(d.me&&d.me.name),66);
 try{const m=d.me,me={name:NETN(m.name)||'Moi',col:/^#[0-9a-f]{3,8}$/i.test(m.col)?m.col:'#2bb3a3',sk:m.sk,skill:+m.skill||.5,sick:m.sick,streak:m.streak|0,fit:!!m.fit,boost:!!m.boost,camp:m.camp|0,tribe:m.tribe|0,wins:m.wins|0,hand:[],st:{},alive:true,bot:false};
  const L=looksFor(S.mode);LOOK[me.name]=L[(m.lk|0)%L.length];
  if(!EPR[d.g]&&!['fire','poteau','corde','camp'].includes(d.g))throw new Error('?');
  v=await netLocal(d.g,me,d)}catch(e){console.warn('play',e);v=50}
 NET.busy=false;clearInterval(fiv);netSend({k:'fr',end:1});v=Number.isFinite(v)?Math.max(0,Math.min(100,Math.round(v))):50;
 NET.done.set(d.id,v);netSend({k:'ans',id:d.id,v});netReapply()}

 <label>Ton prénom <input type="text" id="nn" maxlength="12" value="${esc(NET.name||NETN(S.names[0])||'')}" style="width:9em"></label>
 <button class="big" id="ncreate">➕ Créer un salon</button>
 <div class="row"><input type="text" id="ncode" maxlength="4" placeholder="CODE" style="text-transform:uppercase;width:5.5em;font-size:1.2rem;text-align:center"><button id="njoin">🔑 Rejoindre ce salon</button></div>

   else if(x.id==='njoin'){const code=(document.getElementById('ncode').value||'').toUpperCase().replace(/[^A-Z]/g,'');

    setTimeout(()=>{if(!NET.host&&!NET.begun)onlineUI('Aucun hôte trouvé pour le code '+code+'.')},6000)}
  }catch(err){NET.on=false;onlineUI('Connexion impossible : '+esc((err&&(err.message||err.code))||'erreur'))}}}
